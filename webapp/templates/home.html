{% extends "base.html" %}
{% block title %}ADIRI — Performance Tracking{% endblock %}
{% block content %}
<div class="text-center py-10 sm:py-14">
  <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-stone-900">ADIRI</h1>
  <p class="mt-2 text-lg font-medium text-forest">Performance Tracking</p>
  <p class="mt-3 font-mono text-sm text-stone-500">Choose a sheet to work on</p>
</div>

<div class="mx-auto grid max-w-4xl gap-5 sm:grid-cols-2">
  {% for s in sections %}
  <a href="{{ url_for(s.slug ~ '.dashboard') }}"
     class="group flex flex-col gap-4 rounded-xl border border-stone-200 bg-white p-6 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-forest/40 hover:shadow-md">
    <div class="flex items-center justify-between">
      <span class="inline-flex h-11 w-11 items-center justify-center rounded-lg bg-forest-light text-forest">
        <i data-lucide="{{ s.icon }}" class="h-5 w-5"></i>
      </span>
      <i data-lucide="arrow-right" class="h-4 w-4 text-stone-300 transition-all group-hover:translate-x-0.5 group-hover:text-forest"></i>
    </div>
    <div>
      <span class="block text-lg font-semibold text-stone-900">{{ s.title }}</span>
      <span class="mt-1 block text-sm text-stone-500">{{ s.blurb }}</span>
    </div>
    <div class="flex flex-wrap gap-x-4 gap-y-1 border-t border-stone-100 pt-3 font-mono text-xs text-stone-400">
      <span class="flex items-center gap-1"><i data-lucide="layout-dashboard" class="h-3 w-3"></i> Dashboard</span>
      <span class="flex items-center gap-1"><i data-lucide="plus-circle" class="h-3 w-3"></i> Add Entry</span>
      <span class="flex items-center gap-1"><i data-lucide="history" class="h-3 w-3"></i> History</span>
    </div>
  </a>
  {% endfor %}
</div>
{% endblock %}
